<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Files</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #263e55; /* Matches the main workspace background */
            color: #e2e8f0;
            padding: 50px 20px;
            margin: 0;
        }

        /* Central dashboard panel to match the workspace sidebars */
        .dashboard-panel {
            max-width: 800px;
            margin: 0 auto;
            background-color: #334e68; /* Matches the Asset Catalog panel color */
            border-radius: 8px;
            padding: 35px 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #1f3347; /* Dark, subtle divider */
            padding-bottom: 20px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
            font-weight: 600;
        }

        /* Button styled to match your "Save Layout" button */
        .new-project-btn {
            background-color: #475f77;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.2s ease-in-out;
            border: 1px solid #5a738d;
        }

        .new-project-btn:hover {
            background-color: #5a738d;
        }

        /* Updated Button Styles for dark theme */
        .button-container {
            display: flex;
            align-items: center;
            margin: 14px 0;
            background-color: #21354a; /* Deep blue background for inactive state */
            border-radius: 6px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            border: 1px solid #1f3347;
        }

        .button-container:hover {
            transform: translateY(-2px);
            background-color: #2a435c; /* Lighter hover state matching workspace assets */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .button-container button {
            width: 100%;
            padding: 18px 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            color: #e2e8f0;
            background-color: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .empty-state {
            color: #94a3b8;
            font-style: italic;
            margin-top: 20px;
            text-align: center;
            padding: 40px 0;
            font-size: 15px;
        }
        /* NEW: Delete Button Styles */
        .delete-btn {
            background-color: transparent;
            color: #ef4444; /* Red color */
            border: 1px solid #ef4444 !important;
            padding: 8px 12px !important;
            border-radius: 4px !important;
            font-size: 13px !important;
            width: auto !important;
            margin-right: 15px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background-color: #ef4444 !important;
            color: white !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Central Wrapper for the Dark Theme -->
    <div class="dashboard-panel">

        <!-- Header Section with Title and New Project Button -->
        <div class="page-header">
            <h2>Your Saved Blueprints</h2>
            <a href="/view" class="new-project-btn">+ New Project</a>
        </div>

        <!-- The dynamic zone for buttons -->
        <div id="file-dashboard">

            <!-- JINJA2: This loop automatically reads the database! -->
            <!-- JINJA2: This loop automatically reads the database! -->
     <!-- JINJA2: This loop automatically reads the database! -->
        {% if user and user.projects %}
            {% for project in user.projects %}
                <div class="button-container" style="justify-content: space-between;">

                    <!-- 1. The Open Project Button -->
                    <button onclick="window.location.href='/view?project_id={{ project.id }}'" style="flex-grow: 1;">
                        📁 &nbsp;&nbsp;{{ project.fileName }}
                    </button>

                    <!-- 2. The New Delete Button -->
                    <button class="delete-btn" onclick="deleteProject({{ project.id }})">
                        Delete
                    </button>

                </div>
            {% endfor %}
        {% else %}
            <p class="empty-state">You haven't saved any blueprints yet. Click "New Project" to get started.</p>
        {% endif %}

        </div> <!-- Closes file-dashboard -->

    </div> <!-- Closes dashboard-panel -->
<script>
        async function deleteProject(projectId) {
            // Ask for confirmation so the user doesn't delete by accident
            const confirmDelete = confirm("Are you sure you want to delete this blueprint? This cannot be undone.");
            if (!confirmDelete) return;

            try {
                // NOTE: Change '/delete_project/' to match whatever you named your Python route!
                const response = await fetch(`/delete_project/${projectId}`, {
                    method: 'POST', // or 'DELETE', depending on how you wrote your Python route
                });

                if (response.ok) {
                    // Refresh the page to show the project is gone
                    window.location.reload();
                } else {
                    alert("Failed to delete the project. Check your server logs.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Network error. Could not connect to the server.");
            }
        }
    </script>

</body>
</html>
