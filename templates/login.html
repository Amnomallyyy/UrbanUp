{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-family: sans-serif;">
    <h2 style="margin-top: 0; color: #1e293b;">Login Portal</h2>
    
    <form action="{{ url_for('auth.login') }}" method="POST">
        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold; color: #475569;">Email Address</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold; color: #475569;">Password</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Sign In
        </button>
    </form>
    
    <p style="margin-top: 15px; font-size: 14px; text-align: center; color: #64748b;">
        Don't have an account? <a href="{{ url_for('auth.signup') }}" style="color: #2563eb; text-decoration: none;">Create one here</a>
    </p>
</div>
{% endblock %}   //this is login.html
